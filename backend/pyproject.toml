[project]
name = "englishtestcompro"
version = "0.1.0"
description = "Backend API for AI-assisted English practice"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi[standard]>=0.162.0,<1.0",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.16,<2.0",
    "pydantic-settings>=2.10,<3.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.4,<10.0",
    "ruff>=0.12,<1.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["integration: requires an explicitly configured disposable PostgreSQL database"]
